# Builds this branch into ghcr.io/derfred/trilium for the bugzoo cluster
# (derfred/bugzoo-infrastructure, components/trilium). Not part of upstream.
#
# amd64 only, from Dockerfile.alpine: the same build upstream publishes as
# triliumnext/trilium for linux/amd64 (main-docker.yml), minus the e2e matrix.
# Tags: <base>-journal-times (moving) and <base>-journal-times-<sha7> (deploy this one).
name: bugzoo image

on:
  push:
    branches:
      - journal-child-times
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/derfred/trilium
  BASE_VERSION: v0.106.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests of the calendar change
        run: pnpm --filter @triliumnext/client exec vitest run src/widgets/collections/calendar/event_builder.spec.ts

      - name: Update build info
        run: pnpm run chore:update-build-info

      - name: Run the TypeScript build
        run: pnpm run server:build

      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:${BASE_VERSION}-journal-times,${IMAGE}:${BASE_VERSION}-journal-times-${short}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/server
          file: apps/server/Dockerfile.alpine
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/derfred/Trilium
            org.opencontainers.image.revision=${{ github.sha }}
          push: true

      - name: Summary
        run: |
          echo "Pushed ${{ steps.tags.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
